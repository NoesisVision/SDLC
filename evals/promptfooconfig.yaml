# Promptfoo Configuration for Coding Agent Evaluation
# This configuration compares Claude Code, Gemini CLI, and Codex on technical PM tasks

description: "Evaluation of coding agents on technical project management queries"

# Define the providers (coding agents to compare)
providers:
  - id: exec:./claude_exec.js
    label: "Claude Code"

  - id: exec:./gemini_exec.js
    label: "Gemini CLI"

  - id: exec:./codex_exec.js
    label: "Codex"

# Define default test cases (variables passed to prompts)
defaultTest:
  vars:
    cwd: /Users/szjanikowski/Documents/git/new-priint/planner-engine

# Define test cases with expected outputs for evaluation
tests:
  - description: "Test 1: Real Grid Elements Resizing Status Report"
    vars:
      prompt: |
        Role: You are acting as a Senior Technical Product Manager with deep access to the project's technical documentation and Jira history. Your goal is to provide a precise, fact-based status report for the engineering leadership.

        Task: Provide a detailed technical overview and status report regarding the "Real Grid Elements Resizing" capability.

        Required Information:
        * Feature Overview & Ownership:
            * Describe the core functionality of the real grid elements resizing capability.
            * Identify the primary owner/developer responsible for the implementation.
            * Specify the implementation timeline (completion date or current phase).
        * Documentation & Assets:
            * Identify any mockups, technical specifications, or functional documents that describe this feature in detail.
        * Logic & Implementation:
            * Explain the main idea and "rules" behind this logic (e.g., constraints, snapping, or overflow handling).
            * Describe how this feature is integrated with the overall system architecture.

        Please search the codebase at {{cwd}} for relevant information to answer these questions comprehensively.
    assert:
      - type: llm-rubric
        value: |
          The response must include the following key information to be considered accurate:

          1. Ownership: The feature was primarily developed by Szymon Janikowski.

          2. Core Logic:
             - Resizing options are dynamically calculated for every real grid element.
             - Calculation depends on user rights for specific elements and the state of already resized elements.

          3. Architectural Concept:
             - Clear separation between the Page Template (acting as the baseline for resizing) and the Real Grid Elements (the actual resized instances).

          4. System Integration:
             - Implemented as a strictly architecturally separated module.
             - Includes a dedicated set of unit tests, independent of other modules.

          Score the response based on how many of these key facts are correctly identified and explained.
        provider: anthropic:messages:claude-sonnet-4-5-20250929

      - type: llm-rubric
        value: |
          Evaluate the completeness and technical accuracy of the response:
          - Does it provide specific, verifiable facts rather than vague statements?
          - Does it demonstrate access to actual project documentation or code?
          - Is the technical explanation clear and detailed?
          - Does it avoid hallucinating information not present in the codebase?
        provider: anthropic:messages:claude-sonnet-4-5-20250929

  - description: "Test 2: Messaging Backend Comprehensive Status"
    vars:
      prompt: |
        Role: Technical Project Manager / Lead Developer

        Task: Provide a comprehensive status update on the messaging backend implementation. Your response must cover the following areas:

        1. Ownership & Responsibility: Identify the stakeholders responsible for the conceptual design, the developers who performed the implementation, and the engineers who conducted the code reviews.

        2. Architecture & Documentation: Provide a high-level overview of the architectural decisions. Specify which architecture was chosen, the rationale behind this choice, and list all related technical documentation.

        3. Task Tracking: Present a clear breakdown of the work by status. List which tickets (tasks) have been fully implemented and which are currently in the planning phase or backlog.

        4. References to design: provide clear references to the design of the features.

        Please search the codebase at {{cwd}} for relevant information including Jira tickets (PRIINT-*), documentation, and commit history to answer these questions comprehensively.
    assert:
      - type: llm-rubric
        value: |
          The response must include the following details to be considered accurate:

          1. Ownership & Concept:
             - Concept Development: Led by Szymon Janikowski and Paweł Gilewski.
             - Documentation: Must include references to appropriate documentation links.

          2. Implementation & Responsibility:
             - Krzysztof Pawlak: Responsible for ticket PRIINT-12423.
             - Marek Lenart: Responsible for ticket PRIINT-12424.

          3. Architectural Decisions:
             - Decision: Rejection of the queue-based solution (Message Queue).
             - Rationale: The solution was deemed overly complex; justification is provided in the conceptual document by Paweł Gilewski.

          4. Task Tracking (Tickets):
             - Main Epic: PRIINT-12404.
             - Implemented/In Progress:
               * PRIINT-12423: Design database schema for messages (Implemented).
               * PRIINT-12424: Implementation (Currently in the testing phase).
             - Backlog: Approximately 11 unassigned/unimplemented tickets.
             - Design: References to Figma for UI/UX specifications.

          Score the response based on how many of these specific facts are correctly identified.
        provider: anthropic:messages:claude-sonnet-4-5-20250929

      - type: llm-rubric
        value: |
          Evaluate the depth and accuracy of the technical analysis:
          - Does it identify specific ticket numbers and assignees?
          - Does it explain the architectural decision-making process?
          - Does it provide references to actual documentation?
          - Does it accurately represent the project status and backlog?
          - Does it avoid making assumptions or providing generic responses?
        provider: anthropic:messages:claude-sonnet-4-5-20250929

# Output configuration
outputPath: ./promptfoo-results.json

# Additional configuration for better evaluation
sharing: false