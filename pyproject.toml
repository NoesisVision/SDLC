[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noesis-sdlc"
version = "1.0.0"
description = "SDLC tools and MCP servers for Noesis"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Proprietary"}
authors = [
    {name = "Noesis Team"}
]

dependencies = [
    "mcp>=1.0.0",
    "falkordblite>=0.4.0",
    "spacy>=3.7.0",
    "sentence-transformers>=2.3.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.24.0",
    "pysbd>=0.3.4",
    "langdetect>=1.0.9",
    "pydantic>=2.0.0",
    "python-dotenv",
    "opik",
    "harbor",
    "claude-code-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "noesis-graph",
]

# Note: This repository contains standalone scripts (MCP servers, TypeScript tools)
# rather than installable Python packages. Dependencies are managed here, but
# there's no package to install. MCP servers are run directly from src/mcp_servers/*/server.py

[tool.hatch.build.targets.wheel]
packages = ["contracts", "src/agent_extensions", "src/mcp_servers", "src/p3", "src/utils"]

[tool.uv.sources]
noesis-graph = { path = "src/agent_extensions/plugins/noesis/mcp/noesis_graph", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "real_db: test uses real FalkorDB lifecycle (not shared instance)",
    "e2e: end-to-end tests using Claude CLI (slow, uses LLM)",
]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]

[tool.black]
line-length = 120
target-version = ["py314"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redislite.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "spacy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py314"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "node_modules",
    "dist",
    "build",
]
