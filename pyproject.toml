[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noesis-sdlc"
version = "1.0.0"
description = "SDLC tools and MCP servers for Noesis"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Proprietary"}
authors = [
    {name = "Noesis Team"}
]

dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "pysbd>=0.3.4",
    "langdetect>=1.0.9",
]

# Note: Skill scripts use PEP 723 inline metadata for their own dependencies.
# This pyproject.toml only covers the contracts module and shared dev tooling.

[tool.hatch.build.targets.wheel]
packages = ["contracts"]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src/agent_extensions/plugins/noesis/scripts",
    "tests/agent_extensions/plugins/noesis/scripts",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "e2e: end-to-end tests using Claude CLI (slow, uses LLM)",
]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "node_modules",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long
]
